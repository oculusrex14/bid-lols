# RC3 (S-10.7): dependency update automation.
# npm for application dependencies; GitHub Actions for workflow drift.
# Weekly; capped PR count keeps review load sane. Security patches from
# these PRs are applied like any other review — no auto-merge.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5